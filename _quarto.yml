project:
  type: website
  output-dir: _site
  resources:
    - reports/figures/
  render:
    - index.qmd
    - reports/index.qmd
    - "!task.md"

website:
  title: "E-Commerce Sales & Customer Analytics"
  description: "Diagnóstico Analítico, Otimização de Margem e Predição Preventiva At-Purchase"
  site-url: "https://talesgomes27.github.io/ecommerce_sales_customer_analytics"
  navbar:
    search: true
    left:
      - href: index.qmd
        text: "Relatório Executivo"
    tools:
      - icon: sliders
        href: https://ecommerce-sales-customer-analytics.streamlit.app/
        text: "Simulador Streamlit"
      - icon: github
        href: https://github.com/talesgomes27/ecommerce_sales_customer_analytics
        text: "Código no GitHub"

format:
  html:
    theme: cosmo
    lang: pt-BR
    toc: true
    toc-depth: 3
    toc-title: "Nesta Página"
    number-sections: true
    smooth-scroll: true
    code-fold: true
    code-tools: true
    title-block-banner: true
    fig-dpi: 300
    df-print: paged
    css: styles.css
    include-after-body: toggle-toc.html

jupyter:
  kernel: python3

execute:
  freeze: auto
  echo: false
  warning: false
